<style id="ifc-admin-sidebar-styles">

    height: 17px;
    flex-shrink: 0;
  }
  .admin-nav-badge {
    margin-left: auto;
    font-size: 10px;
    font-weight: 800;
    background-color: #dc2626;
    color: #ffffff;
    padding: 2px 8px;
    border-radius: 9999px;
    line-height: 1.3;
  }
  .admin-sidebar-footer {
    padding: 20px 24px;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
  }
  .admin-logout-btn {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 13.5px;
    font-weight: 600;
    color: #94a3b8;
    text-decoration: none;
    transition: color 0.15s ease;
  }
  .admin-logout-btn:hover {
    color: #ffffff;
  }
  .admin-logout-btn svg {
    width: 17px;
    height: 17px;
  }
